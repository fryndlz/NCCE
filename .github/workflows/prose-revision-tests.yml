name: NCCE prose revision regression
on:
  push:
    paths:
      - 'src/exchange_automation.py'
      - 'src/migrations.py'
      - 'src/server.py'
      - 'scripts/writing_exchange/Code.gs'
      - 'tests/test_exchange_automation.py'
      - 'src/historical_backfill.py'
      - 'src/editorial_revision_seed.py'
      - 'tests/test_editorial_revision_seed.py'
      - 'scripts/writing_exchange/Bulk.gs'
      - 'tests/test_historical_backfill.py'
      - '.github/workflows/prose-revision-tests.yml'
  pull_request:
    paths:
      - 'src/exchange_automation.py'
      - 'src/migrations.py'
      - 'src/server.py'
      - 'scripts/writing_exchange/Code.gs'
      - 'tests/test_exchange_automation.py'
      - 'src/historical_backfill.py'
      - 'src/editorial_revision_seed.py'
      - 'tests/test_editorial_revision_seed.py'
      - 'scripts/writing_exchange/Bulk.gs'
      - 'tests/test_historical_backfill.py'
      - '.github/workflows/prose-revision-tests.yml'

jobs:
  revision-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q src tests/test_exchange_automation.py tests/test_historical_backfill.py
      - name: Run exchange end-to-end tests
        run: python tests/test_exchange_automation.py
      - name: Run isolated historical backfill tests
        run: python tests/test_historical_backfill.py
      - name: Run one-shot editorial revision seed checks
        run: python tests/test_editorial_revision_seed.py
      - name: Parse Google Apps Script relay JavaScript
        run: |
          node -e "new Function(require('fs').readFileSync('scripts/writing_exchange/Code.gs','utf8'))"
          node -e "new Function(require('fs').readFileSync('scripts/writing_exchange/Bulk.gs','utf8'))"
      - name: Run writing waterfall tests
        run: python tests/test_writing_waterfall.py
