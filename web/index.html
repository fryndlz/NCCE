<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NCCE — Campaign Chronicle</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/writing.css">
  <link rel="stylesheet" href="/machine.css">
  <link rel="stylesheet" href="/reliquary.css">
  <link rel="stylesheet" href="/terminal-polish.css">
</head>
<body>
 <div class="machine-shell">
  <aside class="terminal-context prototype-context" aria-label="Related campaign records"></aside>
  <aside class="terminal-register prototype-register" aria-label="Campaign register"></aside>
  <header class="site-header">
    <div class="machine-nameplate">
      <h1>NCCE</h1>
      <div class="brand">Dominion Krakamunda</div>
    </div>
  <nav aria-label="Campaign sections">
    <button data-view="chronicle" class="active" aria-current="page"><span class="module-number" aria-hidden="true">01</span><span class="module-label">Chronicle</span></button>
    <button data-view="gangs"><span class="module-number" aria-hidden="true">02</span><span class="module-label">Gangs</span></button>
    <button data-view="fighters"><span class="module-number" aria-hidden="true">03</span><span class="module-label">Fighters</span></button>
    <button data-view="places"><span class="module-number" aria-hidden="true">04</span><span class="module-label">Places</span></button>
    <button data-view="battles"><span class="module-number" aria-hidden="true">05</span><span class="module-label">Battles</span></button>
    <button data-view="archive"><span class="module-number" aria-hidden="true">06</span><span class="module-label">Archive</span></button>
    <button data-view="workshop"><span class="module-number" aria-hidden="true">07</span><span class="module-label">Writer Workshop</span></button>
  </nav>
  </header>
  <nav class="machine-breadcrumb" aria-label="Breadcrumb">
    <button type="button" class="terminal-home" data-home aria-label="Campaign Chronicle"><span class="terminal-home-icon" aria-hidden="true">⌂</span></button>
    <span class="breadcrumb-separator" aria-hidden="true">›</span>
    <span id="machinePath" class="breadcrumb-path">Chronicle</span>
  </nav>
  <div class="votive-lights" aria-hidden="true"><span class="votive votive-a"></span><span class="votive votive-b"></span><span class="votive votive-c"></span><span class="votive votive-d"></span></div>
  <div class="screen-effects" aria-hidden="true"><span class="screen-static static-left"></span><span class="screen-static static-mind"></span><span class="screen-static static-evidence"></span></div>
  <div class="sync-box">
    <button data-view="system" class="machine-system" type="button" aria-label="System diagnostics">System</button>
    <div id="health" class="status" role="status" aria-live="polite">Connecting to Krakamunda…</div>
    <button id="syncNow" type="button">Refresh from Sheet</button>
    <button id="logout" type="button" hidden>Sign out</button>
  </div>
  <main id="app"><div class="loading-state" role="status">Opening the campaign chronicle…</div></main>

 </div>
  <footer class="machine-footer"><span>Campaign archive · Necromunda</span><span>Mechanical truth / authored canon / sourced inference</span></footer>
  <script src="/writing.js"></script>
  <script src="/writing_activity.js"></script>
  <script src="/workshop.js"></script>
  <script src="/app.js"></script>
</body>
</html>
